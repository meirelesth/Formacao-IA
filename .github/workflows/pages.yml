name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package public site only
        run: |
          mkdir -p _public/materiais
          cp *.html *.css *.js _public/
          cp -r assets _public/
          cp favicon.ico _public/
          cp materiais/Portfolio_Formacao_IA_VIP.pdf _public/materiais/
          test ! -f CNAME || cp CNAME _public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
