name: Validate student backend
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s server -p 'test_*.py' -v
      - run: |
          node --check aluno.js
          node --check entrar.js
          node --check acesso.js
          node --check admin.js
      - run: docker build -t formacao-backend .
